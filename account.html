<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>登录 / 注册 · 小杨TK</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/account.css?v=20261020m">
</head>
<body>
  <div class="acc">
    <header class="acc-top">
      <a class="acc-brand" href="./" aria-label="返回首页">
        <span class="acc-seal">杨</span>
        <span>
          <strong>小杨TK</strong>
          <small>ACCOUNT</small>
        </span>
      </a>
      <a class="acc-back" href="./">返回店铺 →</a>
    </header>

    <main class="acc-main">
      <section class="acc-card" data-guest>
        <div class="acc-tabs" role="tablist">
          <button type="button" class="is-active" data-mode="login" role="tab">登录</button>
          <button type="button" data-mode="register" role="tab">注册</button>
        </div>

        <form class="acc-form" data-form novalidate>
          <label class="field">
            <span>账号</span>
            <input type="text" name="username" autocomplete="username" placeholder="2–20 位中文 / 字母 / 数字" spellcheck="false">
          </label>

          <label class="field" data-only-register hidden>
            <span>昵称（可选）</span>
            <input type="text" name="nickname" autocomplete="nickname" placeholder="下单时显示的称呼">
          </label>

          <label class="field">
            <span>密码</span>
            <input type="password" name="password" autocomplete="current-password" placeholder="至少 8 位">
          </label>

          <label class="field" data-only-register hidden>
            <span>确认密码</span>
            <input type="password" name="confirm" autocomplete="new-password" placeholder="再输入一次">
          </label>

          <label class="check" data-only-login>
            <input type="checkbox" name="remember" checked>
            <span>记住我（7 天免登录）</span>
          </label>

          <p class="acc-err" data-err hidden></p>

          <button class="acc-submit" type="submit" data-submit>登录</button>
        </form>

        <p class="acc-switch">
          <span data-switch-text>还没有账号？</span>
          <button type="button" class="link-btn" data-switch>立即注册</button>
        </p>
      </section>

      <section class="acc-card acc-profile" data-profile hidden>
        <p class="kicker">MY ACCOUNT</p>
        <h2 data-profile-name>—</h2>
        <dl class="acc-facts">
          <div><dt>账号</dt><dd data-profile-user>—</dd></div>
          <div><dt>身份</dt><dd data-profile-role>—</dd></div>
          <div><dt>权限</dt><dd data-profile-perm>—</dd></div>
          <div><dt>注册时间</dt><dd data-profile-time>—</dd></div>
        </dl>
        <div class="acc-profile-actions">
          <a class="btn ghost" href="admin.html" data-goto-admin hidden>管理后台</a>
          <a class="btn ghost" href="./">去逛逛</a>
          <button type="button" class="btn primary" data-logout>退出登录</button>
        </div>

        <div class="acc-orders" data-orders hidden>
          <div class="acc-orders-head">
            <h3>本机下单记录</h3>
            <span>共 <b data-order-count>0</b> 单</span>
          </div>
          <div class="acc-order-list" data-order-list></div>
          <p class="acc-orders-note">订单保存在这台设备上，请把订单号发给客服完成付款。</p>
        </div>
      </section>

      <p class="acc-hint" data-acc-hint>
        账号保存在<b>当前浏览器</b>，换设备或清除浏览器数据后需要重新注册。
      </p>
    </main>
  </div>

  <script src="assets/js/auth.js?v=20261020m"></script>
  <script src="assets/js/account.js?v=20261020m"></script>
</body>
</html>
